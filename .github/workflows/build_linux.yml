name: Build Linux Release App

on:
  push:
    paths:
      - 'linux_build.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Linux 桌面端编译依赖库
      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++6 binutils zip

      # 3. 设置 Flutter 环境
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      # 4. 开启 Linux 桌面支持
      - name: Enable Linux support
        run: |
          flutter config --enable-linux-desktop

      # 5. 缓存管理
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}
          restore-keys: |
            pub-linux-${{ runner.os }}-

      # 6. 获取 Flutter 依赖
      - name: Install dependencies
        working-directory: pan_client
        run: flutter pub get

      # 7. 仅在缺少 linux 平台目录时初始化（不覆盖已有代码）
      - name: Ensure Linux Project Exists
        working-directory: pan_client
        run: |
          if [ ! -d "linux" ]; then
            flutter create --platforms=linux --org com.mksha .
          fi

      # 8. 编译 Linux Release 版本（带 Dart 混淆 + 抽离符号表）
      - name: Build Linux App (Obfuscated)
        working-directory: pan_client
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output_linux"
          mkdir -p "$GITHUB_WORKSPACE/vanguard_symbols"

          flutter build linux --release -t lib/main.dart \
            --obfuscate \
            --split-debug-info="$GITHUB_WORKSPACE/vanguard_symbols"

      # 9. 二进制 Strip（剥离 C/C++ 冗余调试符号）
      - name: Strip Binary Symbols
        run: |
          BUNDLE_DIR="pan_client/build/linux/x64/release/bundle"
          strip --strip-unneeded "$BUNDLE_DIR/pan_client" || true
          strip --strip-unneeded "$BUNDLE_DIR"/lib/*.so || true

      # 10. 打包应用主程序 (.tar.gz)
      - name: Create App Archive
        run: |
          tar -czvf "$GITHUB_WORKSPACE/output_linux/pan-client-linux-x64-v1.0.${{ github.run_number }}.tar.gz" \
            -C "pan_client/build/linux/x64/release/bundle" .

      # 11. 打包符号表 (.zip)
      - name: Archive Debug Symbols
        run: |
          zip -r -9 "$GITHUB_WORKSPACE/output_linux/pan-client-linux-symbols-v1.0.${{ github.run_number }}.zip" \
            -j "$GITHUB_WORKSPACE/vanguard_symbols"/*

      # 12. 发布产物到 GitHub Releases
      - name: Release Linux App & Symbols to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ### pan_client Linux Release (Build ${{ github.run_number }})
            * **应用安装包**：`pan-client-linux-x64-v1.0.${{ github.run_number }}.tar.gz` （解压即用）
            * **解析符号表**：`pan-client-linux-symbols-v1.0.${{ github.run_number }}.zip` （保留备用，用于还原崩溃堆栈）
          files: |
            output_linux/pan-client-linux-x64-v1.0.${{ github.run_number }}.tar.gz
            output_linux/pan-client-linux-symbols-v1.0.${{ github.run_number }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
