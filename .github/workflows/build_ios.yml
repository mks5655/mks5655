name: Build iOS Release App (IPA for TrollStore & Sideload)

on:
  push:
    paths:
      - 'ios_build.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 设置 Flutter 环境
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      # 缓存管理
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-ios-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            pub-ios-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}
            pub-ios-${{ runner.os }}

      
        
          
      # 4. 获取 Flutter 依赖
      - name: Install dependencies
        working-directory: pan_client
        run: flutter pub get

      # 5. 安装 CocoaPods 依赖
      - name: Install iOS Pods
        working-directory: pan_client/ios
        run: |
          pod install --repo-update

      # 6. 禁用签名并编译 iOS App (带混淆 + 抽离符号表)
      - name: Build iOS App (No Codesign + Obfuscate)
        working-directory: pan_client
        run: |
          # 清空 project.pbxproj 里的 Development Team 校验
          sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 传递无签名标志给 xcodebuild
          export FLUTTER_XCODE_CODE_SIGN_IDENTITY=""
          export FLUTTER_XCODE_CODE_SIGNING_REQUIRED="NO"
          export FLUTTER_XCODE_CODE_SIGNING_ALLOWED="NO"
          export FLUTTER_XCODE_DEVELOPMENT_TEAM=""

          # 创建输出目录
          mkdir -p "$GITHUB_WORKSPACE/output_ios"
          mkdir -p "$GITHUB_WORKSPACE/vanguard_symbols"

          flutter build ios --release --no-codesign -t lib/main.dart \
            --no-tree-shake-icons \
            --obfuscate \
            --split-debug-info="$GITHUB_WORKSPACE/vanguard_symbols"

      # 7. 打包 IPA 产物
      - name: Create IPA archive
        run: |
          cd pan_client/build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 "$GITHUB_WORKSPACE/output_ios/pan-client-ios-v1.0.${{ github.run_number }}.ipa" Payload

      # 8. 打包符号表 (Symbols ZIP)
      - name: Archive Debug Symbols
        run: |
          cd "$GITHUB_WORKSPACE"
          zip -r -9 "output_ios/pan-client-ios-symbols-v1.0.${{ github.run_number }}.zip" vanguard_symbols

      # 9. 清理旧 Actions 缓存
      - name: Delete old iOS caches before saving new
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const currentRunId = "${{ github.run_id }}";
              for (const cache of caches.data.actions_caches) {
                const isIosCache = cache.key.startsWith('pub-ios-');
                const isNotCurrentRun = !cache.key.endsWith(currentRunId);
                if (isIosCache && isNotCurrentRun) {
                  console.log(`[iOS Cleanup] Deleting old cache: ${cache.key} (ID: ${cache.id})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                }
              }
            } catch (error) {
              console.log('Error deleting old iOS caches:', error.message);
            }

      # 10. 发布产物 (IPA + 符号表) 到 GitHub Releases
      - name: Release iOS IPA & Symbols to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ### pan_client iOS Release (Build ${{ github.run_number }})
            * **应用安装包**：`pan-client-ios-v1.0.${{ github.run_number }}.ipa` （未签名，适配巨魔 TrollStore、爱思助手、AltStore、Signous 等工具）
            * **解析符号表**：`pan-client-ios-symbols-v1.0.${{ github.run_number }}.zip` （保留备用，用于还原 `--obfuscate` 混淆后的 Crash 堆栈）
          files: |
            output_ios/pan-client-ios-*.ipa
            output_ios/pan-client-ios-symbols-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      # # 6. 禁用签名并编译 iOS App
