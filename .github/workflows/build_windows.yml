name: Build Windows Release App (x64)

on:
  push:
    paths:
      - 'windows_build.txt'
  workflow_dispatch:

permissions:
  actions: write # 授权删除 Caches 和 Artifacts
  contents: write # 授权写入 Release 和文件

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Java 环境
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. 设置 Flutter 环境
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      # 4. 显式配置 Windows 桌面端支持
      - name: Enable Windows support
        run: |
          flutter config --enable-windows-desktop

      # 缓存管理
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-windows-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            pub-windows-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}
            pub-windows-${{ runner.os }}

      
      # 5. 获取 Flutter 依赖
      - name: Install dependencies
        working-directory: pan_client
        run: flutter pub get

      # 💡 6. 删除了原先会强行覆盖项目的 flutter create --overwrite 命令！

      # 7. 编译 Windows Release 版本 (带混淆 + 抽离符号表)
      - name: Build Windows App (Obfuscated)
        working-directory: pan_client
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\output_windows"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vanguard_symbols"

          flutter build windows --release -t lib/main.dart `
            --obfuscate `
            --split-debug-info="$env:GITHUB_WORKSPACE\vanguard_symbols"

      # 8. 打包为 ZIP 格式 (包含 exe、dll 以及 data 文件夹)
      - name: Create ZIP archive
        shell: powershell
        run: |
          $buildDir = "pan_client/build/windows/x64/runner/Release"
          $zipPath = "$env:GITHUB_WORKSPACE\output_windows\pan-client-windows-x64-v1.0.${{ github.run_id }}.zip"
          
          # 打包 Release 目录下的所有运行依赖
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath -Force

      # 9. 打包符号表 (.zip)
      - name: Archive Debug Symbols
        shell: powershell
        run: |
          $symbolsDir = "$env:GITHUB_WORKSPACE\vanguard_symbols"
          $symbolsZip = "$env:GITHUB_WORKSPACE\output_windows\pan-client-windows-symbols-v1.0.${{ github.run_id }}.zip"
          
          Compress-Archive -Path "$symbolsDir\*" -DestinationPath $symbolsZip -Force

      # 清理旧缓存
      - name: Delete old Windows caches before saving new
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const currentRunId = "${{ github.run_id }}";
              for (const cache of caches.data.actions_caches) {
                const isWinCache = cache.key.startsWith('pub-windows-');
                const isNotCurrentRun = !cache.key.endsWith(currentRunId);
                if (isWinCache && isNotCurrentRun) {
                  console.log(`[Windows Cleanup] Deleting old cache: ${cache.key} (ID: ${cache.id})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                }
              }
            } catch (error) {
              console.log('Error deleting old Windows caches:', error.message);
            }

      # 10. 发布产物到 GitHub Releases
      - name: Release Windows App & Symbols to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ### pan_client Windows Release (Build ${{ github.run_number }})
            * **应用压缩包**：`pan-client-windows-x64-v1.0.${{ github.run_id }}.zip` （Windows 64位绿化免安装版，解压后双击 `.exe` 运行）
            * **解析符号表**：`pan-client-windows-symbols-v1.0.${{ github.run_id }}.zip` （保留备用，用于还原崩溃堆栈）
          files: |
            output_windows/pan-client-windows-x64-*.zip
            output_windows/pan-client-windows-symbols-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}