name: Build Windows Release App (x64)

on:
  push:
    paths:
      - 'windows_build.txt'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows support
        run: flutter config --enable-windows-desktop

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-windows-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}-${{ github.run_id }}
          restore-keys: |
            pub-windows-${{ runner.os }}-${{ hashFiles('pan_client/pubspec.lock') }}
            pub-windows-${{ runner.os }}

      - name: Install dependencies
        working-directory: pan_client
        run: flutter pub get

      - name: Build Windows App (Obfuscated)
        working-directory: pan_client
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\output_windows"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\vanguard_symbols"

          flutter build windows --release -t lib/main.dart `
            --obfuscate `
            --split-debug-info="$env:GITHUB_WORKSPACE\vanguard_symbols"

      # 将 dll/ 目录下的 DLL 复制进 Release 目录，供 ZIP、安装包与 MSIX 共用
      - name: Copy extra DLLs into Release
        shell: powershell
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\pan_client\build\windows\x64\runner\Release"
          $dllDir = "$env:GITHUB_WORKSPACE\dll"
          if (Test-Path $dllDir) {
            Copy-Item -Path "$dllDir\*.dll" -Destination $buildDir -Force
            Write-Host "Copied DLLs from $dllDir to $buildDir"
          } else {
            Write-Host "No dll directory found, skipping."
          }

      - name: Create ZIP archive
        shell: powershell
        run: |
          $buildDir = "pan_client/build/windows/x64/runner/Release"
          $zipPath = "$env:GITHUB_WORKSPACE\output_windows\pan-client-windows-x64-v1.0.${{ github.run_id }}.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath $zipPath -Force

      # 生成 MSIX 安装包（--build-windows=false 避免重复编译覆盖刚复制进去的 DLL）
      - name: Build MSIX Package
        working-directory: pan_client
        shell: powershell
        run: |
          dart run msix:create --build-windows=false

          $releaseDir = "$env:GITHUB_WORKSPACE\pan_client\build\windows\x64\runner\Release"
          $msixFile = Get-ChildItem -Path $releaseDir -Filter "*.msix" | Select-Object -First 1
          if (-not $msixFile) {
            throw "MSIX file not found. Check msix_config in pubspec.yaml."
          }

          $destMsix = "$env:GITHUB_WORKSPACE\output_windows\pan-client-windows-x64-v1.0.${{ github.run_id }}.msix"
          Move-Item -Path $msixFile.FullName -Destination $destMsix -Force
          Write-Host "MSIX saved to $destMsix"
          
      - name: Archive Debug Symbols
        shell: powershell
        run: |
          $symbolsDir = "$env:GITHUB_WORKSPACE\vanguard_symbols"
          $symbolsZip = "$env:GITHUB_WORKSPACE\output_windows\pan-client-windows-symbols-v1.0.${{ github.run_id }}.zip"
          Compress-Archive -Path "$symbolsDir\*" -DestinationPath $symbolsZip -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build single-file Installer (Setup.exe)
        shell: powershell
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\pan_client\build\windows\x64\runner\Release"
          $outputDir = "$env:GITHUB_WORKSPACE\output_windows"
          $issPath = "$env:GITHUB_WORKSPACE\installer.iss"

          $issContent = @"
          [Setup]
          AppId={{8F3C2A1B-7D4E-4A9C-9B2F-1E5D6C7A8B90}
          AppName=pan_client
          AppVersion=1.0.${{ github.run_number }}
          AppPublisher=pan_client
          DefaultDirName={autopf}\pan_client
          DefaultGroupName=pan_client
          OutputDir=$outputDir
          OutputBaseFilename=pan-client-windows-x64-v1.0.${{ github.run_id }}-setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\pan_client.exe
          DisableProgramGroupPage=yes

          [Files]
          Source: "$buildDir\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs
          Source: "$env:GITHUB_WORKSPACE\dll\*.dll"; DestDir: "{app}"; Flags: ignoreversion skipifsourcedoesntexist

          [Icons]
          Name: "{group}\pan_client"; Filename: "{app}\pan_client.exe"
          Name: "{autodesktop}\pan_client"; Filename: "{app}\pan_client.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加任务:"

          [Run]
          Filename: "{app}\pan_client.exe"; Description: "立即运行 pan_client"; Flags: nowait postinstall skipifsilent
          "@

          $issContent = $issContent -replace '(?m)^\s{10}', ''
          Set-Content -Path $issPath -Value $issContent -Encoding UTF8

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $iscc $issPath

      - name: Delete old Windows caches before saving new
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const caches = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const currentRunId = "${{ github.run_id }}";
              for (const cache of caches.data.actions_caches) {
                const isWinCache = cache.key.startsWith('pub-windows-');
                const isNotCurrentRun = !cache.key.endsWith(currentRunId);
                if (isWinCache && isNotCurrentRun) {
                  console.log(`[Windows Cleanup] Deleting old cache: ${cache.key} (ID: ${cache.id})`);
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id,
                  });
                }
              }
            } catch (error) {
              console.log('Error deleting old Windows caches:', error.message);
            }

      - name: Release Windows App & Symbols to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ### pan_client Windows Release (Build ${{ github.run_number }})
            * **单文件安装包（推荐）**：`pan-client-windows-x64-v1.0.${{ github.run_id }}-setup.exe` （双击安装，自动创建快捷方式）
            * **MSIX 安装包**：`pan-client-windows-x64-v1.0.${{ github.run_id }}.msix` （适用于微软商店提交/安装）
            * **应用压缩包**：`pan-client-windows-x64-v1.0.${{ github.run_id }}.zip` （绿化免安装版，解压后双击 `.exe` 运行）
            * **解析符号表**：`pan-client-windows-symbols-v1.0.${{ github.run_id }}.zip` （保留备用，用于还原崩溃堆栈）
          files: |
            output_windows/pan-client-windows-x64-*.zip
            output_windows/pan-client-windows-x64-*.msix
            output_windows/pan-client-windows-x64-*-setup.exe
            output_windows/pan-client-windows-symbols-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}