name: Clear All Artifacts

on:
  push:
    paths:
      - 'clean_artifact.txt' 
      
  workflow_dispatch: # 支持在 GitHub 网页手动一键触发

permissions:
  actions: write # 明确授予读写 Actions artifacts 的权限

  
jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            for (const artifact of res.data.artifacts) {
              console.log(`Deleting artifact: ${artifact.name} (ID: ${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
